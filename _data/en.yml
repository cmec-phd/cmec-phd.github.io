  meta_description: "PhD programme in computational electroacoustic music composition, generative algorithmic models and computational complexity at the Conservatorio di Musica \"N. Piccinni\" of Bari."
  hero_kicker: "Doctoral programme"
  hero_tagline: "Computational Electroacoustic Music Composition, Generative Algorithmic Models and Computational Complexity"
  hero_institution: "Conservatorio di Musica \"N. Piccinni\" di Bari — Cycle XLI"
  about_title: "The programme"
  about_text: "The doctoral programme of the Conservatorio \"N. Piccinni\" of Bari treats electroacoustic composition as both an artistic practice and a field of research, where algorithmic models and computational formalisms are means of composing and, at the same time, objects of inquiry. Where music theory, acoustics and perception, computer science and complex systems meet, it trains composer-researchers who build their own theoretical and technical tools and share their results with the scientific and artistic community."
