home:
  meta_title: "Dottorato CMEC — Conservatorio di Musica \"N. Piccinni\" di Bari"
  meta_description: "Dottorato di ricerca in composizione musicale elettroacustica computazionale, modelli algoritmici generativi e complessità computazionale presso il Conservatorio di Musica \"N. Piccinni\" di Bari."
  hero_kicker: "Dottorato di ricerca"
  hero_tagline: "Composizione musicale elettroacustica computazionale, modelli algoritmici generativi e complessità computazionale"
  hero_institution: "Conservatorio di Musica \"N. Piccinni\" di Bari — Ciclo XLI"
  about_title: "Il programma"
  about_text: "Il dottorato del Conservatorio \"N. Piccinni\" di Bari considera la composizione elettroacustica insieme pratica artistica e campo di ricerca: modelli algoritmici e formalismi computazionali vi sono mezzi per comporre e, al tempo stesso, oggetti di indagine. All'incontro fra teoria musicale, acustica e percezione, informatica e sistemi complessi, il programma forma compositori-ricercatori capaci di costruire i propri strumenti teorici e tecnici e di condividerne gli esiti con la comunità scientifica e artistica."
